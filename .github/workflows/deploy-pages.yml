# ============================================================================
# VOLTARA - Deploy frontend ke GitHub Pages (gratis)
# ============================================================================
# Setiap push ke `main` akan:
#   1. install dependency (npm ci, memakai package-lock.json)
#   2. type check (tsc --noEmit) sebagai gerbang kualitas
#   3. build produksi dengan base path /<nama-repo>/
#   4. publish ke GitHub Pages
#
# Hasil: https://<pemilik>.github.io/<nama-repo>/
#
# CATATAN BACKEND
#   Build ini sengaja berjalan dalam MODE DEMO: seluruh data berasal dari mock
#   lokal (src/services/mock/*), dan login memakai persona demo. Alasannya,
#   backend Supabase lokal (127.0.0.1) tidak bisa dijangkau pengunjung internet.
#
#   Untuk mengaktifkan backend sungguhan, isi Repository Variables
#   (Settings -> Secrets and variables -> Actions -> Variables):
#       VITE_SUPABASE_URL       = https://<project-id>.supabase.co
#       VITE_SUPABASE_ANON_KEY  = <anon/publishable key>
#   lalu jalankan ulang workflow ini.
#
#   JANGAN pernah menambahkan SUPABASE_SERVICE_ROLE_KEY di sini: semua nilai
#   VITE_* ikut tertanam ke bundle yang diunduh browser.
# ============================================================================

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan satu deploy berjalan; push berikutnya membatalkan yang masih antre.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          # Pages menyajikan dari subfolder, jadi aset harus memakai prefix repo.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Kosong = mode demo. Isi lewat Repository Variables untuk backend asli.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Aktifkan GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
